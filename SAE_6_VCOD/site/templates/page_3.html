
{% extends "base.html" %}

{% block title %}Fournisseur et Catégorie de consomation{% endblock %}

{% block content %}
<div id="charts-container" style="display: flex; flex-direction: column; gap: 40px; justify-content: center; align-items: center;">

    <!-- Ligne 1 : deux graphiques côte à côte -->
    <div style="display: flex; flex-wrap: wrap; gap: 20px; width: 100%; justify-content: space-around;">
        <div class="chart-wrapper" style="flex: 1 1 45%;">
            <h2>Top Fournisseur</h2>
            <canvas id="operateurChart" width="600" height="280"></canvas>
        </div>

        <div class="chart-wrapper" style="flex: 1 1 45%;">
            <h2>Répartition de la consommation par catégorie</h2>
            <canvas id="categorieChart" width="600" height="280"></canvas>
        </div>
    </div>

    <!-- Ligne 2 : un seul graphique pleine largeur -->
    <div class="chart-wrapper" style="width: 90%;">
        <h2 style="text-align: center;">Répartition par catégorie pour les principaux fournisseurs ({{ year }})</h2>
        <canvas id="fournisseurCategorieChart"></canvas>
    </div>

</div>

<script>
    {% set top5_operateurs = operateur_repartition.items() | sort(attribute=1, reverse=true) | list %}
    const operateurs = {{ top5_operateurs[:5] | tojson }};
    const operateurLabels = operateurs.map(item => item[0]);
    const operateurValues = operateurs.map(item => item[1]);

    const operateurData = {
        labels: operateurLabels,
        datasets: [{
            label: 'Consommations fournies',
            data: operateurValues,
            backgroundColor: ['#4e79a7','#f28e2c','#e15759','#76b7b2','#59a14f']
        }]
    };

    new Chart(document.getElementById('operateurChart'), {
        type: 'bar',
        data: operateurData,
        options: {
            responsive: true,
            indexAxis: 'y',
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    title: { display: true, text: 'Consommation (MWh)' }
                }
            }
        }
    });

    const labelMapping = {
        "RES": "Résidentiel",
        "ENT": "Entreprises",
        "PRO": "Petits professionnels",
        "ENT_PRO": "Pros/Entreprises"
    };

    const rawLabels = {{ categorie_repartition.keys() | list | tojson }};
    const labels = rawLabels.map(l => labelMapping[l] || l);

    const categorieData = {
        labels: labels,
        datasets: [{
            label: 'Consommation par catégorie',
            data: {{ categorie_repartition.values()|list|tojson }},
            backgroundColor: ['#8cd17d','#b6992d','#499894','#d37295','#fabfd2','#9d7660']
        }]
    };

    new Chart(document.getElementById('categorieChart'), {
        type: 'pie',
        data: categorieData,
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'right' }
            }
        }
    });

    const fournisseurs = {{ fournisseur_categorie.keys()|list|tojson }};
    const categories = ["RES", "ENT", "PRO", "ENT_PRO"];
    const rawData = {{ fournisseur_categorie|tojson }};
    const couleurs = {
        "RES": "#4e79a7",
        "ENT": "#f28e2c",
        "PRO": "#e15759",
        "ENT_PRO": "#76b7b2"
    };

    const datasets = categories.map(cat => ({
        label: labelMapping[cat],
        data: fournisseurs.map(op => rawData[op][cat]),
        backgroundColor: couleurs[cat]
    }));

    new Chart(document.getElementById('fournisseurCategorieChart'), {
        type: 'bar',
        data: {
            labels: fournisseurs,
            datasets: datasets
        },
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Répartition de la consommation par catégorie'
                },
                tooltip: { mode: 'index', intersect: false },
                legend: { position: 'top' }
            },
            scales: {
                x: { stacked: true },
                y: {
                    stacked: true,
                    beginAtZero: true,
                    title: { display: true, text: 'Consommation (MWh)' }
                }
            }
        }
    });
</script>
{% endblock %}
