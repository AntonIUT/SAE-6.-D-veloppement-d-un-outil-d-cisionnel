<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tableau de bord{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <a href="{{ url_for('accueil') }}" class="{% if request.endpoint == 'accueil' %}active{% endif %}">Accueil</a>
            <a href="{{ url_for('page1.page_1') }}" class="{% if request.endpoint == 'page1.page_1' %}active{% endif %}">Consommation</a>
            <a href="{{ url_for('page2.page_2') }}" class="{% if request.endpoint == 'page2.page_2' %}active{% endif %}">Carte</a>
            <a href="{{ url_for('page3.page_3') }}" class="{% if request.endpoint == 'page3.page_3' %}active{% endif %}">Évolution</a>
        </div>
        <div class="nav-right">
            <span class="username">{{ session.get('username', '') }}</span>
            <a class="btn-logout" href="{{ url_for('auth.logout') }}" onclick="return confirm('Voulez-vous vraiment vous déconnecter ?')">Déconnexion</a>
        </div>
    </header>
    <div class="layout">
        {% if page != 'accueil.html' %}
        <aside class="sidebar">
            <h3>Filtres</h3>
            <br>
            <form method="GET" action="{{ url_for(request.endpoint) }}">
                <label for="conso_type">Sélectionnez un type de consommation :</label>
                <select name="conso_type" id="conso_type">
                    <option value="elec" {% if request.args.get('conso_type') == 'elec' %}selected{% endif %}>Électricité</option>
                    <option value="gaz" {% if request.args.get('conso_type') == 'gaz' %}selected{% endif %}>Gaz</option>
                    <option value="chauffage" {% if request.args.get('conso_type') == 'chauffage' %}selected{% endif %}>Chauffage</option>
                </select>
                <br><br>
                <label for="year">Année :</label>
                <select name="year" id="year">
                    {% for y in annees %}
                        <option value="{{ y }}" {% if year == y %}selected{% endif %}>{{ y }}</option>
                    {% endfor %}
                </select>
                <br><br>
                <label for="region">Région :</label>
                <select name="region" id="region">
                    <option value="" {% if not region %}selected{% endif %}>Toutes les régions</option>
                    {% for r in regions %}
                        <option value="{{ r }}" {% if region == r %}selected{% endif %}>{{ r }}</option>
                    {% endfor %}
                </select>
                <br><br>

                <button type="submit">Appliquer</button>
            </form>
        </aside>
        {% endif %}
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
